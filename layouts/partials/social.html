
                <div class="resume-footer text-center">

                    <ul class="resume-social-list list-inline mx-auto mb-0 d-inline-block text-muted">
                        {{ range .Site.Params.social.list }}
                        <li class="list-inline-item mb-lg-0 mr-3">
                            <a class="resume-link" href="{{ .url }}" target="_blank" rel="me noopener" aria-label="{{ .title }}">
                                {{ partial "icon.html" (dict "name" .icon "class" "icon-lg mr-2") }}
                                <span class="d-none d-lg-inline-block text-muted">{{ .title }}</span>
                            </a>
                        </li>
                        {{ end }}
                    </ul>

                </div><!--//resume-footer-->
