
                        <div class="resume-contact col-12 col-md-6 col-lg-4 col-xl-3">
                            <ul class="list-unstyled mb-0">
                                {{ range .Site.Params.contact.list }}
                                <li class="mb-2">{{ partial "icon.html" (dict "name" .icon "class" "mr-2") }}<a class="resume-link" href="{{ .url | safeURL }}">{{ .text }}</a></li>
                                {{ end }}
                                <li class="mb-0">{{ partial "icon.html" (dict "name" "map-marker-alt" "class" "mr-2") }}{{ .Site.Params.contact.location }}</li>
                            </ul>
                        </div><!--//resume-contact-->
