{{- with site.Config.Services.GoogleAnalytics.ID -}}
    <div id="consent" class="consent" role="region" aria-label="Analytics consent" hidden>
        <p>May I use Google Analytics to see how this site is used? It is only loaded if you accept. <a href="{{ "/privacy/" | relURL }}">Privacy</a></p>
        <div class="consent-actions">
            <button type="button" id="consent-accept" class="btn btn-primary">Accept</button>
            <button type="button" id="consent-decline" class="btn">Decline</button>
        </div>
    </div>
    <script>
    (function () {
        var id = {{ . }}, key = "analytics-consent", box = document.getElementById("consent"),
            settings = document.getElementById("consent-settings");
        function load() {
            if (window.gtagLoaded) return;
            window.gtagLoaded = true;
            var s = document.createElement("script");
            s.async = true;
            s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
            document.head.appendChild(s);
            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { dataLayer.push(arguments); };
            gtag("js", new Date());
            gtag("config", id);
        }
        function clearCookies() {
            document.cookie.split(";").forEach(function (c) {
                var n = c.split("=")[0].trim();
                if (n === "_ga" || n.indexOf("_ga_") === 0) {
                    document.cookie = n + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/";
                    document.cookie = n + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain=" + location.hostname;
                }
            });
        }
        function choose(v) {
            try { localStorage.setItem(key, v); } catch (e) {}
            box.hidden = true;
            if (v === "granted") load(); else clearCookies();
            settings.focus();
        }
        var saved = null;
        try { saved = localStorage.getItem(key); } catch (e) {}
        settings.hidden = false;
        if (saved === "granted") load(); else if (saved !== "denied") box.hidden = false;
        document.getElementById("consent-accept").onclick = function () { choose("granted"); };
        document.getElementById("consent-decline").onclick = function () { choose("denied"); };
        settings.onclick = function () { box.hidden = false; document.getElementById("consent-accept").focus(); };
    })();
    </script>
{{- end -}}
