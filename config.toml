title = "Jorge Andreu Calatayud | Senior Staff Site Reliability Engineer"
publishDir = "docs"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

# Analytics only loads after the visitor accepts (see layouts/partials/consent.html).
[services.googleAnalytics]
    id = "G-1E8H3S9CNM"

# Do not publish the unreferenced full-size source images that sit in static/ and content/.
[module]
    [[module.mounts]]
        source = "content"
        target = "content"
        files = ["! **.png"]
    [[module.mounts]]
        source = "static"
        target = "static"
        files = ["! images/j.png", "! images/jorge.png"]
    [[module.mounts]]
        source = "layouts"
        target = "layouts"
    [[module.mounts]]
        source = "data"
        target = "data"
    [[module.mounts]]
        source = "assets"
        target = "assets"
    [[module.mounts]]
        source = "i18n"
        target = "i18n"
    [[module.mounts]]
        source = "archetypes"
        target = "archetypes"

